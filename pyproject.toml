[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "harness", "data", "skills/dynamic"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF", "S"]
ignore = ["B905", "RUF001", "S101", "S112", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S108"]
"evals/run_evals.py" = ["S102"]
