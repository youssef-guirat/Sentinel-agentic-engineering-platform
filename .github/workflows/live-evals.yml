name: Sentinel Live Agent Evals

on:
  workflow_dispatch:
    inputs:
      min_pass:
        description: Minimum accepted pass rate
        required: true
        default: "0.8"

permissions:
  contents: read

jobs:
  agent-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify.py --offline
      - name: Run provider-backed evaluations
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/verify.py --agent-evals --min-pass "${{ inputs.min_pass }}"
